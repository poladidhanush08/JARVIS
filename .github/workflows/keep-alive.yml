# Keeps the free Render backend awake so the first visitor never waits for a cold start.
# Render's free plan sleeps after 15 idle minutes. One always-awake service uses up to 744
# of the 750 free hours in a 31-day month, and that pool is shared by every free service on
# the Render account: keep this the only free service there. Set a repository variable
# JARVIS_API_URL to override the URL below.
# Pings every 5 minutes because GitHub often delays scheduled runs by 5-20 minutes.
# Note: GitHub pauses scheduled workflows after 60 days without repository activity.
name: keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping the API health endpoint
        env:
          URL: ${{ vars.JARVIS_API_URL || 'https://jarvis-hv19.onrender.com' }}
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 60 "$URL/api/health"; then
              echo
              echo "awake (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 20 s"
            sleep 20
          done
          echo "API did not answer after 3 attempts"
          exit 1
