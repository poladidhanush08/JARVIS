# Keeps the free Render backend awake so the first visitor never waits for a cold start.
# Render's free plan sleeps after 15 idle minutes; one always-awake service uses about
# 720 of the 750 free hours a month. Set a repository variable JARVIS_API_URL to override.
# Note: GitHub pauses scheduled workflows after 60 days without repository activity.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API health endpoint
        env:
          URL: ${{ vars.JARVIS_API_URL || 'https://jarvis-hv19.onrender.com' }}
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 "$URL/api/health"; then
              echo
              echo "awake (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 20 s"
            sleep 20
          done
          echo "API did not answer after 3 attempts"
          exit 1
